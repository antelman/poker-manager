<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1712">
<meta name="description" content="ניהול ערב פוקר בין חברים - כניסות, ספירת ז'יטונים וחישוב מי משלם למי">
<title>ערב פוקר</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="פוקר">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-chip" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.6"/>
    <path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>
  </symbol>
  <symbol id="i-stack" viewBox="0 0 24 24">
    <ellipse cx="12" cy="6.5" rx="7" ry="2.8"/>
    <path d="M5 6.5v5c0 1.55 3.13 2.8 7 2.8s7-1.25 7-2.8v-5"/>
    <path d="M5 11.5v5c0 1.55 3.13 2.8 7 2.8s7-1.25 7-2.8v-5"/>
  </symbol>
  <symbol id="i-pay" viewBox="0 0 24 24">
    <path d="M20 8H5m0 0 3.4-3.4M5 8l3.4 3.4"/>
    <path d="M4 16h15m0 0-3.4-3.4M19 16l-3.4 3.4"/>
  </symbol>
  <symbol id="i-history" viewBox="0 0 24 24">
    <path d="M3.2 10.4A9 9 0 1 1 3 12.7"/><path d="M3 4.6v5.8h5.6"/>
    <path d="M12 7.6V12l3.4 2"/>
  </symbol>
</svg>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">ערב פוקר</span>
    </div>
    <div class="pot">
      <span class="pot-label">בקופה</span>
      <strong class="pot-value" id="potValue">0</strong>
    </div>
  </div>
</header>

<main id="main">

  <!-- ===================== משחק ===================== -->
  <section class="view view-game" id="view-game" aria-label="ניהול המשחק">
    <h2 class="board-heading">השולחן</h2>

    <details class="panel settings" id="settingsCard">
      <summary class="settings-summary">
        <span>הגדרות המשחק</span>
        <span class="settings-preview" id="settingsPreview"></span>
      </summary>
      <div class="settings-body">
        <div class="field-row">
          <label class="field">
            <span class="field-label">עלות כניסה</span>
            <input type="number" id="buyInInput" inputmode="decimal" min="0" step="1" value="50">
          </label>
          <label class="field">
            <span class="field-label">מטבע</span>
            <select id="currencyInput">
              <option value="₪">₪ שקל</option>
              <option value="$">$ דולר</option>
              <option value="€">€ אירו</option>
            </select>
          </label>
        </div>

        <div class="field-row">
          <label class="field">
            <span class="field-label">שיטת ספירה בסוף</span>
            <select id="modeInput">
              <option value="chips">ז'יטונים</option>
              <option value="cash">סכום כסף</option>
            </select>
          </label>
          <label class="field" id="chipsField">
            <span class="field-label">ז'יטונים בכניסה</span>
            <input type="number" id="chipsInput" inputmode="numeric" min="1" step="1" value="100">
          </label>
        </div>

        <p class="hint" id="chipValueHint"></p>
      </div>
    </details>

    <div class="panel">
      <form class="add-player" id="addPlayerForm">
        <input type="text" id="playerNameInput" placeholder="שם השחקן" autocomplete="off"
               enterkeyhint="done" maxlength="24" aria-label="שם השחקן">
        <button type="submit" class="btn btn-primary">הוסף</button>
      </form>
      <label class="checkbox">
        <input type="checkbox" id="autoBuyIn" checked>
        <span>לחייב כניסה אוטומטית בהוספת שחקן</span>
      </label>
    </div>

    <div id="playersList" class="players"></div>

    <div class="panel totals" id="gameTotals"></div>

    <div class="panel danger-zone">
      <button class="btn btn-ghost" id="resetGameBtn">איפוס המשחק</button>
    </div>
  </section>

  <!-- ===================== ספירה ===================== -->
  <section class="view view-count" id="view-count" aria-label="ספירת סיום" hidden>
    <h2 class="board-heading">ספירת סיום</h2>
    <div class="panel intro">
      <p class="hint" id="countHint"></p>
    </div>
    <div id="countList" class="players"></div>
    <div class="panel" id="countStatus"></div>
  </section>

  <!-- ===================== חשבון ===================== -->
  <section class="view view-settle" id="view-settle" aria-label="סיכום ותשלומים" hidden>
    <h2 class="board-heading">החשבון</h2>
    <div id="settleContent"></div>
  </section>

  <!-- ===================== היסטוריה ===================== -->
  <section class="view view-history" id="view-history" aria-label="היסטוריית משחקים" hidden>
    <h2 class="board-heading">היסטוריה</h2>
    <div id="historyContent"></div>
  </section>

</main>

<nav class="tabbar" id="tabbar" aria-label="ניווט ראשי">
  <button class="tab is-active" data-view="game" type="button">
    <svg class="tab-icon" aria-hidden="true"><use href="#i-chip"/></svg>
    <span class="tab-text">משחק</span>
  </button>
  <button class="tab" data-view="count" type="button">
    <svg class="tab-icon" aria-hidden="true"><use href="#i-stack"/></svg>
    <span class="tab-text">ספירה</span>
  </button>
  <button class="tab" data-view="settle" type="button">
    <svg class="tab-icon" aria-hidden="true"><use href="#i-pay"/></svg>
    <span class="tab-text">חשבון</span>
  </button>
  <button class="tab" data-view="history" type="button">
    <svg class="tab-icon" aria-hidden="true"><use href="#i-history"/></svg>
    <span class="tab-text">היסטוריה</span>
  </button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
