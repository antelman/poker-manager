name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the settlement engine tests
        run: npm test

      - name: Check the static site is complete
        run: |
          for file in index.html styles.css app.js sw.js manifest.webmanifest \
                      src/engine.js src/store.js \
                      icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png \
                      fonts/assistant-hebrew.woff2 fonts/assistant-latin.woff2 \
                      fonts/frank-ruhl-libre-hebrew.woff2 fonts/frank-ruhl-libre-latin.woff2 \
                      fonts/suez-one-hebrew.woff2 fonts/suez-one-latin.woff2; do
            test -f "$file" || { echo "missing: $file"; exit 1; }
          done
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          node --check app.js
          node --check sw.js
          node --check scripts/serve.js
